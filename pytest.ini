; The section header must be [pytest] in a pytest.ini file. It previously read
; [tool.pytest.ini_options] - the name pytest looks for inside pyproject.toml -
; which meant pytest silently ignored every setting in this file, --strict-markers
; included. The values were also TOML-quoted rather than plain ini. Both are
; fixed here, so marker registration and the default deselection below are now
; actually in effect.
[pytest]
pythonpath = . tests
testpaths = tests
; Integration tests hit real provider APIs: they cost quota, need keys, and go
; red when someone else's free tier is having a bad afternoon. Deselected by
; default; run them on purpose with `pytest -m integration`.
addopts = -q --strict-markers -m "not integration"
markers =
    integration: makes real API calls to configured providers (needs keys, costs quota)
